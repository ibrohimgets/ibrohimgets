<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bunny and the Magic Rainbow</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Layout: one centered 16:9 "TV" stage, a chunky toy-like control deck under it, scene chips as a storybook strip. */
  @font-face { font-family: "Fredoka"; font-weight: 600; font-display: swap; src: url("assets/fonts/fredoka-600-latin.woff2") format("woff2"); }
  :root {
    --bg: #F3EEFB;          /* lavender paper */
    --panel: #FFFFFF;
    --ink: #3B2F55;         /* plum ink */
    --muted: #7C6F96;
    --accent: #FF6FA8;      /* bubblegum */
    --accent-ink: #FFFFFF;
    --track: #E3DAF3;
    --ring: #9B5DE5;
    --stage-edge: #D9CCF0;
    --font-display: "Fredoka", "Baloo 2", "Comic Sans MS", system-ui, sans-serif;
    --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1B1630; --panel: #272043; --ink: #F1EBFF; --muted: #B3A8D1; --accent: #FF7FB2; --accent-ink: #2A1030;
      --track: #3A3160; --ring: #C9A0FF; --stage-edge: #3A3160; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1B1630; --panel: #272043; --ink: #F1EBFF; --muted: #B3A8D1; --accent: #FF7FB2; --accent-ink: #2A1030;
    --track: #3A3160; --ring: #C9A0FF; --stage-edge: #3A3160; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-ui);
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 20px 32px;
  }
  .wrap { max-width: 1280px; margin: 0 auto; display: grid; gap: 14px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; }
  h1 { font-family: var(--font-display); font-weight: 600; font-size: clamp(1.5rem, 3.2vw, 2.3rem); margin: 0; letter-spacing: .01em; text-wrap: balance; }
  h1 .r { background: linear-gradient(90deg, #FF5A5F, #FF9F43, #E0B400, #4CB35A, #4D96FF, #9B5DE5); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .meta { color: var(--muted); font-size: .9rem; }
  .stage { position: relative; width: 100%; max-width: 100%; aspect-ratio: 16 / 9; border-radius: 22px; overflow: hidden;
    background: #BFE6FF; box-shadow: 0 0 0 6px var(--stage-edge), 0 18px 40px rgba(60, 30, 110, .18); }
  canvas { display: block; width: 100%; height: 100%; }
  .start { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(255, 255, 255, .28); border: 0; cursor: pointer; padding: 0; }
  .start span { display: inline-flex; align-items: center; gap: .5em; font-family: var(--font-display); font-weight: 600; font-size: clamp(1.1rem, 3vw, 2.2rem);
    background: #FF6FA8; color: #fff; padding: .55em 1.2em; border-radius: 999px; box-shadow: 0 6px 0 #D44A86, 0 14px 30px rgba(0,0,0,.18); }
  .start:hover span { transform: translateY(-2px); }
  .start:focus-visible span { outline: 4px solid #9B5DE5; outline-offset: 4px; }
  .deck { background: var(--panel); border-radius: 20px; padding: 12px 14px; display: grid; gap: 12px; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  button.btn { font-family: var(--font-display); font-weight: 600; font-size: 1rem; border: 0; border-radius: 999px; padding: .55em 1em;
    background: var(--track); color: var(--ink); cursor: pointer; min-height: 44px; }
  button.btn.primary { background: var(--accent); color: var(--accent-ink); min-width: 104px; }
  button.btn[aria-pressed="true"] { background: var(--ring); color: #fff; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--ring); outline-offset: 2px; }
  .time { font-variant-numeric: tabular-nums; color: var(--muted); font-size: .95rem; min-width: 96px; }
  input[type=range] { flex: 1 1 220px; min-width: 0; accent-color: var(--accent); height: 28px; }
  .scenes { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
  .scene { text-align: left; border: 0; border-radius: 14px; padding: 8px 10px; background: var(--track); color: var(--ink); cursor: pointer; min-width: 0; }
  .scene b { display: block; font-family: var(--font-display); font-weight: 600; font-size: .78rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .scene span { display: block; font-size: .88rem; line-height: 1.25; }
  .scene.on { background: var(--accent); color: var(--accent-ink); }
  .scene.on b { color: inherit; opacity: .85; }
  .hint { color: var(--muted); font-size: .85rem; margin: 0; line-height: 1.5; }
  kbd { font-family: var(--font-ui); background: var(--track); border-radius: 6px; padding: 1px 6px; font-size: .8rem; }
  @media (max-width: 760px) { .scenes { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (max-width: 420px) { .scenes { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (prefers-reduced-motion: reduce) { .start:hover span { transform: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Bunny and the <span class="r">Magic Rainbow</span></h1>
    <div class="meta">A 2-minute cartoon for ages 4–5 · 6 scenes</div>
  </header>

  <div class="stage" id="stage">
    <canvas id="c" width="1920" height="1080" aria-label="Cartoon: Bunny and the Magic Rainbow"></canvas>
    <button class="start" id="start" aria-label="Play the cartoon"><span>▶ Play the cartoon</span></button>
  </div>

  <div class="deck">
    <div class="row">
      <button class="btn primary" id="play">▶ Play</button>
      <span class="time" id="time">0:00 / 2:00</span>
      <input type="range" id="seek" min="0" max="120" step="0.05" value="0" aria-label="Seek">
      <button class="btn" id="cc" aria-pressed="true">CC</button>
      <button class="btn" id="fs">Full screen</button>
      <!--rec--><button class="btn" id="rec" title="Records the whole cartoon in real time and downloads a WebM video">Record video</button><!--/rec-->
    </div>
    <div class="scenes" id="scenes"></div>
    <p class="hint">Keys: <kbd>Space</kbd> play/pause · <kbd>←</kbd>/<kbd>→</kbd> 5 seconds · <kbd>1</kbd>–<kbd>6</kbd> jump to a scene · <kbd>C</kbd> subtitles · <kbd>F</kbd> full screen</p>
  </div>
</div>

<audio id="audio" src="audio/soundtrack.mp3" preload="auto"></audio>
<script src="src/timeline.js"></script>
<script src="src/engine.js"></script>
<script src="src/scenes.js"></script>
<script>
(function () {
  const cv = document.getElementById("c"), ctx = cv.getContext("2d");
  const audio = document.getElementById("audio");
  const $ = (id) => document.getElementById(id);
  const D = CARTOON.duration;
  let playing = false, subs = true, clockStart = 0, clockBase = 0, audioOk = true, recording = null;

  audio.addEventListener("error", () => { audioOk = false; });

  const now = () => {
    if (audioOk && audio.readyState >= 2) return audio.currentTime;
    return playing ? clockBase + (performance.now() - clockStart) / 1000 : clockBase;
  };
  const fmt = (t) => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, "0")}`;

  // scene chips
  const sc = $("scenes");
  CARTOON.SCENE_TITLES.forEach((name, i) => {
    const b = document.createElement("button");
    b.className = "scene"; b.id = "scene" + (i + 1);
    b.innerHTML = `<b>Scene ${i + 1} · ${fmt(i * 20)}</b><span>${name}</span>`;
    b.onclick = () => seek(i * 20 + 0.01);
    sc.appendChild(b);
  });

  function draw(t) {
    CARTOON.render(ctx, t, { subtitles: subs });
    $("time").textContent = `${fmt(t)} / ${fmt(D)}`;
    if (document.activeElement !== $("seek")) $("seek").value = t;
    const si = Math.min(5, Math.floor(t / 20));
    [...sc.children].forEach((el, i) => el.classList.toggle("on", i === si));
  }
  function loop() {
    let t = now();
    if (t >= D - 0.02) { t = D - 0.02; pause(); }
    draw(t);
    if (playing) requestAnimationFrame(loop);
  }
  function play() {
    if (now() >= D - 0.05) seek(0);
    playing = true; clockStart = performance.now();
    $("start").hidden = true; $("play").textContent = "❚❚ Pause";
    if (audioOk) audio.play().catch(() => { audioOk = false; });
    requestAnimationFrame(loop);
  }
  function pause() {
    clockBase = now(); playing = false; audio.pause();
    $("play").textContent = "▶ Play";
    if (recording && recording.state === "recording") recording.stop();
  }
  function seek(t) {
    t = Math.max(0, Math.min(D - 0.02, t));
    clockBase = t; clockStart = performance.now();
    try { audio.currentTime = t; } catch (e) {}
    draw(t);
  }

  $("start").onclick = play;
  $("play").onclick = () => (playing ? pause() : play());
  $("seek").oninput = (e) => seek(+e.target.value);
  $("cc").onclick = () => { subs = !subs; $("cc").setAttribute("aria-pressed", subs); if (!playing) draw(now()); };
  $("fs").onclick = () => { const s = $("stage"); (s.requestFullscreen ? s.requestFullscreen() : Promise.reject()).catch(() => {}); };
  document.addEventListener("keydown", (e) => {
    if (e.target.tagName === "INPUT" && e.key !== " ") return;
    if (e.key === " ") { e.preventDefault(); playing ? pause() : play(); }
    else if (e.key === "ArrowRight") seek(now() + 5);
    else if (e.key === "ArrowLeft") seek(now() - 5);
    else if (/^[1-6]$/.test(e.key)) seek((+e.key - 1) * 20 + 0.01);
    else if (e.key.toLowerCase() === "c") $("cc").click();
    else if (e.key.toLowerCase() === "f") $("fs").click();
  });

  // Browser-only export: records canvas + soundtrack in real time to a WebM file.
  const rec = $("rec");
  if (rec) rec.onclick = () => {
    try {
      const ac = new AudioContext();
      const src = ac.createMediaElementSource(audio);
      const dest = ac.createMediaStreamDestination();
      src.connect(dest); src.connect(ac.destination);
      const stream = new MediaStream([...cv.captureStream(30).getVideoTracks(), ...dest.stream.getAudioTracks()]);
      const mime = ["video/webm;codecs=vp9,opus", "video/webm;codecs=vp8,opus", "video/webm"].find((m) => MediaRecorder.isTypeSupported(m));
      const chunks = [];
      recording = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 12e6 });
      recording.ondataavailable = (e) => e.data.size && chunks.push(e.data);
      recording.onstop = () => {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(new Blob(chunks, { type: "video/webm" }));
        a.download = "bunny-and-the-magic-rainbow.webm"; a.click();
        rec.textContent = "Record video"; recording = null;
      };
      seek(0); recording.start(1000); rec.textContent = "Recording…"; play();
      rec.onclick = null;
    } catch (err) {
      rec.textContent = "Recording needs a local web server (see README)";
    }
  };

  const boot = () => { draw(0); CARTOON.render(ctx, 1.6, { subtitles: false }); }; // poster: title card
  (document.fonts ? document.fonts.load('600 60px "Fredoka"').catch(() => {}) : Promise.resolve()).then(boot, boot);
})();
</script>
</body>
</html>
